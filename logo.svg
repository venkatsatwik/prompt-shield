<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Core Emblem Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M50 8 
           L84 20 
           C84 54, 70 78, 50 92 
           C30 78, 16 54, 16 20 
           Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Circuit Shield Inset -->
  <path d="M50 16 
           L78 26 
           C78 52, 66 72, 50 83 
           C34 72, 22 52, 22 26 
           Z" 
        fill="none" 
        stroke="rgba(6, 182, 212, 0.25)" 
        stroke-width="1.5" 
        stroke-dasharray="4, 3" />

  <!-- Central AI Prompt / Keylock Emblem -->
  <!-- Prompt Terminal Bracket: > -->
  <path d="M40 38 L48 46 L40 54" 
        fill="none" 
        stroke="url(#coreGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Secure Keyhole / Vault Bar: _ -->
  <path d="M52 54 L62 54" 
        fill="none" 
        stroke="url(#coreGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Top Security Sensor Dot -->
  <circle cx="50" cy="30" r="3" fill="#10b981" filter="url(#glow)" />
</svg>
